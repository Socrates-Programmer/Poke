version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: poke
      MYSQL_USER: poke_user
      MYSQL_PASSWORD: poke_pass
    volumes:
      - poke_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    env_file: poke/.env         # ← Esta es la línea que faltaba
    environment:
      DATABASE_URL: mysql://poke_user:poke_pass@db:3306/poke
    depends_on:
      db:
        condition: service_healthy
    command: python poke/run.py

volumes:
  poke_db_data: