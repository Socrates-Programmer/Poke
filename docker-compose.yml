version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: poke_db
      POSTGRES_USER: poke_user
      POSTGRES_PASSWORD: poke_pass
    volumes:
      - poke_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poke_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python Poke/poke/app/poke.py
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://poke_user:poke_pass@db:5432/poke_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  poke_db_data:
