version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: poke_db
      MYSQL_USER: poke_user
      MYSQL_PASSWORD: poke_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - poke_db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u poke_user --password=poke_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python poke/app/__init__.py
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql://poke_user:poke_pass@db:3306/poke_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  poke_db_data:
